# Fly.io — Auronis Health (Next.js standalone container).
# Usa o Dockerfile do repo (output: 'standalone', EXPOSE 3000).
# O nome do app precisa ser único no Fly — troque `auronis-health` se já existir
# (ou rode `fly launch --no-deploy` para gerar um nome). Segredos (AUTH_SECRET,
# OWNER_PASSWORD, etc.) NÃO ficam aqui — vão via `fly secrets set` (ver DEPLOY-FLY.md).

app = "auronis-health"
primary_region = "gru"  # São Paulo, alinhado com a região gru1 do Vercel

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  # Liveness/readiness — /api/health é sempre 200 (ver src/app/api/health/route.ts).
  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
