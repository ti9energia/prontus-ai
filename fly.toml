# Fly.io — Auronis Health (Next.js standalone container).
# Usa o Dockerfile do repo (output: 'standalone', EXPOSE 3000).
# O nome do app precisa ser único no Fly — troque `auronis-health` se já existir
# (ou rode `fly launch --no-deploy` para gerar um nome). Segredos (AUTH_SECRET,
# OWNER_PASSWORD, etc.) NÃO ficam aqui — vão via `fly secrets set` (ver DEPLOY-FLY.md).

app = "auronis-health-api"
primary_region = "gru"  # São Paulo, alinhado com a região gru1 do Vercel

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_SITE_URL = "https://auronis-health-api.fly.dev"

[env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_SITE_URL = "https://auronis-health-api.fly.dev"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  # A máquina NUNCA hiberna (auto_stop_machines = "off") — assim não existe
  # cold-start. Com "stop", a máquina parava quando ociosa e o boot do Next
  # (alguns segundos) fazia o health check falhar por uma janela curta → o
  # usuário via "Não foi possível carregar. Tente de novo." e precisava
  # recarregar. Com "off" + min=1, há sempre 1 máquina quente servindo tráfego,
  # sem janela de erro. (Custo: 1 shared-cpu-1x/512MB ligada 24/7 — desprezível.)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  # Liveness/readiness — /api/health é sempre 200 (ver src/app/api/health/route.ts).
  # grace_period generoso p/ o boot do Next standalone não falhar o 1º check.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
